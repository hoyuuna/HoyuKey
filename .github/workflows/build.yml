name: Build and Release HoyuKey

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set dynamic version in Cargo.toml
        shell: powershell
        run: |
          $ver = "0.1.${{ github.run_number }}"
          Write-Host "Setting version to $ver in Cargo.toml..."
          (Get-Content Cargo.toml) -replace 'version = "0.1.0"', "version = `"$ver`"" | Set-Content Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

      - name: Compile Resource & Build Release Binary
        shell: powershell
        run: |
          $rcExe = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter rc.exe -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          Write-Host "Using Windows Resource Compiler: $rcExe"
          & $rcExe /fo app.res app.rc
          $env:RUSTFLAGS = "-C link-arg=app.res"
          cargo build --release

      - name: Prepare Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hoyukey.exe dist/HoyuKey.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoyuKey-v0.1.${{ github.run_number }}-Windows-x64
          path: dist/HoyuKey.exe
          retention-days: 30

      - name: Publish GitHub Pre-Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: "HoyuKey v0.1.${{ github.run_number }} (Pre-release)"
          body: |
            ### ⌨️ HoyuKey Pre-release v0.1.${{ github.run_number }}
            
            Phiên bản pre-release được build tự động qua GitHub Actions từ branch `${{ github.ref_name }}`.

            - **Phiên bản**: `0.1.${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Build**: #${{ github.run_number }}

            #### 📦 Tải về:
            - **`HoyuKey.exe`**: Tải về và nhấp đúp để chạy trực tiếp trên Windows (đã tích hợp icon ứng dụng và hỗ trợ màn hình 4K sắc nét).
          prerelease: true
          draft: false
          files: |
            dist/HoyuKey.exe
