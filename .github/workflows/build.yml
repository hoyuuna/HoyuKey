name: Build and Release HoyuKey

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate version and set in Cargo.toml
        id: version
        shell: powershell
        run: |
          $run_num = ${{ github.run_number }}
          $offset = 60
          $patch = [Math]::Max(0, $run_num - $offset)
          $ver = "1.0.$patch"
          Write-Host "Calculated version: $ver (Build #$patch, Run #$run_num)"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "patch=$patch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Setting version to $ver in Cargo.toml..."
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$ver`"" | Set-Content Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Tests
        run: cargo test --verbose

      - name: Compile Resource & Build Release Binary
        shell: powershell
        run: |
          rc.exe /fo app.res app.rc
          $env:RUSTFLAGS = "-C link-arg=app.res"
          cargo build --release

      - name: Prepare Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hoyukey.exe dist/HoyuKey.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoyuKey-v${{ steps.version.outputs.version }}-Windows-x64
          path: dist/HoyuKey.exe
          retention-days: 30

      - name: Publish GitHub Pre-Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "HoyuKey v${{ steps.version.outputs.version }}"
          body: |
            HoyuKey v${{ steps.version.outputs.version }}
            (Phiên bản được build tự động)

            Phiên bản: ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }} (Build #${{ steps.version.outputs.patch }})

            | File | Dành cho |
            | :--- | :--- |
            | HoyuKey.exe | Windows x64 |

            ---
            ### Hướng dẫn tránh bị Windows Security chặn nhầm:
            Do phần mềm chưa có chữ ký số, Windows Security có thể nhận diện nhầm. Để phần mềm và tính năng tự động cập nhật hoạt động ổn định:
            1. Tạo một thư mục riêng (ví dụ: C:\HoyuKey hoặc D:\HoyuKey) và đặt file HoyuKey.exe vào đó.
            2. Thêm thư mục trên vào danh sách loại trừ (Exclusion) của Windows:
               - Mở **Windows Security** -> chọn **Virus & threat protection**.
               - Tại mục **Virus & threat protection settings**, nhấn **Manage settings**.
               - Cuộn xuống mục **Exclusions**, nhấn **Add or remove exclusions**.
               - Nhấn **Add an exclusion** -> chọn **Folder** rồi chọn thư mục bạn vừa tạo.
          prerelease: true
          draft: false
          files: |
            dist/HoyuKey.exe
