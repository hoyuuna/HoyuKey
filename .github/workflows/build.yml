name: Build and Release HoyuKey

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set dynamic version in Cargo.toml
        shell: powershell
        run: |
          $ver = "1.0.${{ github.run_number }}"
          Write-Host "Setting version to $ver in Cargo.toml..."
          (Get-Content Cargo.toml) -replace 'version = "1.0.0"', "version = `"$ver`"" | Set-Content Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Tests
        run: cargo test --verbose

      - name: Compile Resource & Build Release Binary
        shell: powershell
        run: |
          rc.exe /fo app.res app.rc
          $env:RUSTFLAGS = "-C link-arg=app.res"
          cargo build --release

      - name: Prepare Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hoyukey.exe dist/HoyuKey.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoyuKey-v1.0.${{ github.run_number }}-Windows-x64
          path: dist/HoyuKey.exe
          retention-days: 30

      - name: Publish GitHub Pre-Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HoyuKey v1.0.${{ github.run_number }}"
          body: |
            HoyuKey v1.0.${{ github.run_number }}
            (Phiên bản được build tự động)

            Phiên bản: 1.0.${{ github.run_number }}
            Commit: ${{ github.sha }} (Build #${{ github.run_number }})

            | File | Dành cho |
            | :--- | :--- |
            | HoyuKey.exe | Windows x64 |
          prerelease: true
          draft: false
          files: |
            dist/HoyuKey.exe
