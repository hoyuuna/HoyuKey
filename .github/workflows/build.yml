name: Build and Release HoyuKey

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      patch: ${{ steps.ver.outputs.patch }}
    steps:
      - name: Calculate version
        id: ver
        run: |
          RUN_NUM=${{ github.run_number }}
          OFFSET=157
          PATCH=$(( RUN_NUM >= OFFSET ? RUN_NUM - OFFSET : 0 ))
          VERSION="1.1.$PATCH"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION (Build #$PATCH, Run #$RUN_NUM)"

  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version in Cargo.toml
        shell: powershell
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$ver`"" | Set-Content Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Tests
        run: cargo test --verbose

      - name: Compile Resource & Build Release Binary
        shell: powershell
        run: |
          rc.exe /fo app.res app.rc
          $env:RUSTFLAGS = "-C link-arg=app.res"
          cargo build --release --bin hoyukey

      - name: Prepare Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hoyukey.exe dist/HoyuKey.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoyukey-windows
          path: dist/HoyuKey.exe
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [version, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: hoyukey-windows
          path: release-assets

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: "HoyuKey v${{ needs.version.outputs.version }}"
          body: |
            HoyuKey v${{ needs.version.outputs.version }}

            Phiên bản: ${{ needs.version.outputs.version }}
            Commit: ${{ github.sha }}

            | File | Nền tảng | Mô tả |
            | :--- | :--- | :--- |
            | `HoyuKey.exe` | Windows x64 | Chạy trực tiếp |

            ---
            ### Hướng dẫn cài đặt trên Windows:
            Tải `HoyuKey.exe` về và mở chạy trực tiếp.

            Nếu Windows Security chặn nhầm do phần mềm chưa có chữ ký số:
            1. Cho `HoyuKey.exe` vào một thư mục riêng (ví dụ: `C:\HoyuKey` hoặc `D:\HoyuKey`).
            2. Mở **Windows Security** -> chọn **Virus & threat protection**.
            3. Tại mục **Virus & threat protection settings**, chọn **Manage settings**.
            4. Cuộn xuống mục **Exclusions**, chọn **Add or remove exclusions** rồi thêm thư mục vừa tạo.
          prerelease: true
          draft: false
          files: |
            release-assets/HoyuKey.exe
