[package]
name = "hoyukey"
version = "0.1.0"
edition = "2021"
authors = ["Hoyuuna"]
description = "HoyuKey - Bộ gõ Tiếng Việt siêu nhẹ và hiện đại cho Windows viết bằng Rust"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
